name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - run: npm run verify
      - name: Run live production suite
        env:
          COMMENTARY_LIVE_BASE_URL: https://commentary.dev
          COMMENTARY_LIVE_TOKEN: ${{ secrets.COMMENTARY_LIVE_TOKEN }}
        run: npm run test:live
      - name: Publish when version changed
        run: |
          node scripts/publish-if-needed.mjs
